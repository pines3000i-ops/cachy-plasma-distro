# Fragment konfiguracji Calamares w stylu CachyOS.
# Pelna konfiguracja modulow: patrz https://github.com/CachyOS/CachyOS-Calamares
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - networkcfg
  - locale
  - keyboard
  - users
  - displaymanager
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: cachyplasma
prompt-install: true
dont-chroot: false
