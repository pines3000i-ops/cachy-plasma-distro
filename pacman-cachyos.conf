# pacman.conf dla buildu — repozytoria CachyOS (x86-64-v3) + Arch
# Klucze: sudo pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
#         sudo pacman-key --lsign-key F3B607488DB35A47

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos-v3]
Include = /etc/pacman.d/cachyos-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
